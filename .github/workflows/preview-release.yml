name: Publish signed Preview updater

on:
  workflow_dispatch:
  push:
    tags: ['v*-preview.*']

permissions:
  contents: read

env:
  PREVIEW_RELEASE_REPOSITORY: ldymax34-ship-it/ldymax34-ship-it-brand-material-workbench-releases

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x86_64
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: darwin-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required'; exit 1; }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run verify:core && npm test -- --run && npm run build
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Stage updater assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          SIG=$(find "$ROOT" -type f -name '*.sig' -print -quit)
          test -n "$SIG"
          PACKAGE="${SIG%.sig}"
          test -f "$PACKAGE"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ runner.os }}" = "Windows" ]; then
            UPDATER="release/BrandMaterialWorkbench_${VERSION}_windows-x86_64_updater.exe"
            INSTALLER=$(find "$ROOT/nsis" -type f -name '*.exe' ! -name '*.sig' -print -quit)
            cp "$INSTALLER" "release/BrandMaterialWorkbench_${VERSION}_Windows_x64_Setup.exe"
          else
            UPDATER="release/BrandMaterialWorkbench_${VERSION}_darwin-aarch64_updater.tar.gz"
            DMG=$(find "$ROOT/dmg" -type f -name '*.dmg' -print -quit)
            cp "$DMG" "release/BrandMaterialWorkbench_${VERSION}_macOS_arm64.dmg"
          fi
          cp "$PACKAGE" "$UPDATER"
          cp "$SIG" "$UPDATER.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require release repository token
        shell: bash
        env:
          RELEASE_REPOSITORY_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: |
          test -n "$RELEASE_REPOSITORY_TOKEN" || { echo 'RELEASE_REPOSITORY_TOKEN is required to publish to the public binary repository'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate Preview manifest and validate updater assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          MAC_PACKAGE="release/BrandMaterialWorkbench_${VERSION}_darwin-aarch64_updater.tar.gz"
          WIN_PACKAGE="release/BrandMaterialWorkbench_${VERSION}_windows-x86_64_updater.exe"
          MAC_SIG="${MAC_PACKAGE}.sig"
          WIN_SIG="${WIN_PACKAGE}.sig"
          test -f "$MAC_PACKAGE" && test -f "$WIN_PACKAGE"
          node scripts/create-preview-manifest.mjs "$VERSION" "$MAC_PACKAGE" "$MAC_SIG" "$WIN_PACKAGE" "$WIN_SIG" release/latest-preview.json
          node -e "const m=require('./release/latest-preview.json'); if(Object.keys(m.platforms).join(',') !== 'darwin-aarch64,windows-x86_64') process.exit(1); for(const p of Object.values(m.platforms)) if(/^https?:/.test(p.signature)) process.exit(1)"
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        with:
          repository: ${{ env.PREVIEW_RELEASE_REPOSITORY }}
          tag_name: preview
          name: 品宣物料工作台 Preview
          prerelease: true
          overwrite_files: true
          generate_release_notes: true
          files: release/*
