name: Build desktop preview

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-preview.*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify application
        run: |
          npm run verify:core
          npm test
          npm run build
      - name: Build Tauri bundles
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Stage macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.19-preview.1"
          ARCH="${{ matrix.arch }}"
          mkdir -p release
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -print -quit)
          APP=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name '*.app' -print -quit)
          cp "$DMG" "release/BrandMaterialWorkbench_${VERSION}_macOS_${ARCH}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release/BrandMaterialWorkbench_${VERSION}_macOS_${ARCH}.app.zip"
      - name: Stage Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          Copy-Item $installer.FullName "release/BrandMaterialWorkbench_0.1.19-preview.1_Windows_x64_Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish preview release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum * > BrandMaterialWorkbench_0.1.19-preview.1_SHA256.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: 品宣物料工作台 0.1.19 Preview 1
          prerelease: true
          generate_release_notes: true
          body: |
            内部 Preview 版本。素材全程本地处理，不使用远程 API、CDN 或自动更新。

            - Windows 10/11 x64 安装包内置离线 WebView2，因此体积较大；未正式签名，可能出现 SmartScreen 提示。
            - macOS 当前提供 Apple Silicon 包，使用 ad-hoc 签名；首次启动可能需要在“隐私与安全性”中允许。
            - 临时应用图标仅用于 Preview，不代表正式品牌图标。
          files: release/*
