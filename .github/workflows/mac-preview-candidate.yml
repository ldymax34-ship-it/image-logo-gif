name: Publish signed macOS Preview candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_RELEASE_REPOSITORY: ldymax34-ship-it/ldymax34-ship-it-brand-material-workbench-releases
  PREVIEW_RELEASE_TAG: preview-mac-candidate

jobs:
  build-macos-candidate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required'; exit 1; }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run verify:core && npm test -- --run && npm run build
      - name: Build signed macOS candidate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app,dmg
      - name: Stage candidate assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ROOT="src-tauri/target/aarch64-apple-darwin/release/bundle"
          SIG=$(find "$ROOT" -type f -name '*.sig' -print -quit)
          test -n "$SIG"
          PACKAGE="${SIG%.sig}"
          test -f "$PACKAGE"
          VERSION="$(node -p "require('./package.json').version")"
          UPDATER="release/BrandMaterialWorkbench_${VERSION}_darwin-aarch64_updater.tar.gz"
          DMG=$(find "$ROOT/dmg" -type f -name '*.dmg' -print -quit)
          cp "$PACKAGE" "$UPDATER"
          cp "$SIG" "$UPDATER.sig"
          cp "$DMG" "release/BrandMaterialWorkbench_${VERSION}_macOS_arm64.dmg"
          node scripts/create-mac-candidate-manifest.mjs "$VERSION" "$UPDATER" "$UPDATER.sig" release/latest-preview.json
          node -e "const m=require('./release/latest-preview.json'); if(Object.keys(m.platforms).join(',') !== 'darwin-aarch64') process.exit(1); if(/^https?:/.test(m.platforms['darwin-aarch64'].signature)) process.exit(1)"
      - name: Require release repository token
        shell: bash
        env:
          RELEASE_REPOSITORY_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: test -n "$RELEASE_REPOSITORY_TOKEN" || { echo 'RELEASE_REPOSITORY_TOKEN is required'; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          repository: ${{ env.PREVIEW_RELEASE_REPOSITORY }}
          tag_name: ${{ env.PREVIEW_RELEASE_TAG }}
          name: 品宣物料工作台 macOS Preview Candidate
          prerelease: true
          overwrite_files: true
          body: macOS Apple Silicon candidate only. Validate the updater before promoting Windows to the public Preview channel.
          files: release/*
