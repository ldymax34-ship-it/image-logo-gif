name: Stage signed compression test packages

on:
  push:
    branches:
      - release/0.9.5-compression-tools
    paths:
      - .github/workflows/stage-windows-hardware-test.yml

permissions:
  actions: read
  contents: write

jobs:
  stage-test-package:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "39274314082"
      TEST_TAG: compression-test-0.9.5
    steps:
      - uses: actions/checkout@v4
      - name: Download the successful Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name signed-preview-windows-x86_64 \
            --dir release
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name signed-preview-darwin-aarch64 \
            --dir release
      - name: Publish as an isolated draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TEST_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Signed compression test 0.9.5" \
              --notes "Isolated manual test package. Not used by the automatic updater." \
              --draft \
              --prerelease
          fi
          gh release upload "$TEST_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
