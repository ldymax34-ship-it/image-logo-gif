<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self' data:; media-src 'self' blob: data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'">
    <title>使用回顾 - 一站式渠道素材辅助工具</title>
    <style>
        :root {
            --paper: #0f172a;
            --paper-tint: #1e293b;
            --ink: #e2e8f0;
            --pencil: #94a3b8;
            --rule: #334155;
            --grid: rgba(148,163,184,0.10);
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --highlight: #0c4a6e;
            --serif: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --hand: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: "SFMono-Regular", Consolas, ui-monospace, monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle, rgba(148,163,184,0.07) 1px, transparent 1px) 0 0 / 22px 22px,
                linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
            font-family: var(--hand), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 18px;
            line-height: 1.5;
        }
        .page-shell {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
            padding: 18px 0 48px;
        }
        .wf-canvas {
            background:
                repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 24px),
                repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 24px),
                var(--paper-tint);
            border: 1px solid var(--rule);
            border-radius: 14px;
            box-shadow: 0 16px 38px rgba(0,0,0,0.35);
        }
        .top-bar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }
        h1 {
            margin: 0;
            font-family: var(--serif);
            font-size: clamp(30px, 4vw, 46px);
            line-height: 1;
            color: var(--ink);
        }
        .subtitle {
            margin: 6px 0 0;
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--pencil);
        }
        .nav-tools, .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .nav-tools { margin-top: 12px; }
        .wf-tab, .wf-btn-primary, .wf-btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 8px;
            font: 700 15px/1 var(--hand), sans-serif;
            text-decoration: none;
            cursor: pointer;
        }
        .wf-tab {
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: 999px;
            background: #1e293b;
        }
        .wf-tab:hover { border-color: #38bdf8; color: #e0f2fe; }
        .wf-btn-primary {
            background: var(--accent);
            color: #0b1220;
            border: 1px solid var(--accent);
        }
        .wf-btn-primary:hover { background: var(--accent-hover); }
        .wf-btn-ghost {
            background: #1e293b;
            color: var(--ink);
            border: 1px solid #334155;
        }
        .wf-btn-ghost:hover { background: #243449; }
        button { appearance: none; }
        #exportRoot {
            background: var(--paper-tint);
            border: 1px solid var(--rule);
            border-radius: 12px;
            padding: 22px;
        }
        .section-title {
            margin: 0 0 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--rule);
            font-family: var(--serif);
            font-size: 30px;
            line-height: 1.1;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }
        .tool-block {
            min-height: 150px;
            border: 1px solid var(--rule);
            border-radius: 10px;
            background: #162136;
            padding: 16px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.30);
        }
        .tool-block h3 {
            margin: 0 0 10px;
            font-family: var(--serif);
            font-size: 22px;
            line-height: 1.15;
            color: var(--ink);
        }
        .narrative, .month-metrics {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .narrative li, .month-metrics li {
            position: relative;
            padding-left: 16px;
            margin: 7px 0;
            color: #cbd5e1;
        }
        .narrative li::before, .month-metrics li::before {
            content: ">";
            position: absolute;
            left: 0;
            top: 0;
            color: var(--accent);
            font-family: var(--mono);
            font-weight: 700;
        }
        strong { color: var(--accent); font-family: var(--mono); }
        .month-heading {
            margin: 26px 0 12px;
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--pencil);
        }
        .empty-hint {
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px dashed var(--rule);
            border-radius: 10px;
            color: var(--pencil);
            background: rgba(30,41,59,0.5);
            padding: 24px;
        }
        .start-code {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--rule);
            color: var(--pencil);
            font-family: var(--mono);
            font-size: 13px;
        }
        .start-code strong {
            display: block;
            margin-bottom: 4px;
            color: var(--ink);
            font-family: var(--mono);
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 100;
            display: none;
            border: 1px solid #0e7490;
            border-radius: 8px;
            background: #083344;
            color: #67e8f9;
            padding: 10px 18px;
            font-weight: 700;
            pointer-events: none;
        }
        .toast.show { display: block; }
        @media (max-width: 760px) {
            .top-bar { flex-direction: column; }
            .top-actions { width: 100%; }
            .wf-btn-primary, .wf-btn-ghost { flex: 1 1 auto; }
            #exportRoot { padding: 16px; }
        }
        @media print {
            .top-actions, .nav-tools { display: none; }
            body { background: #fff; }
            #exportRoot { border: 0; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="top-bar wf-canvas">
            <div>
                <h1>使用回顾</h1>
                <p class="subtitle">Local usage review · offline only</p>
                <nav class="nav-tools">
                    <a class="wf-tab" href="photo1.html">批量修改图片尺寸</a>
                    <a class="wf-tab" href="video1.html">视频转 GIF</a>
                </nav>
            </div>
            <div class="top-actions">
                <button type="button" class="wf-btn-primary" id="btnExportImg">导出图片</button>
                <button type="button" class="wf-btn-ghost" id="btnExportTxt">导出 TXT</button>
            </div>
        </header>

        <main id="exportRoot">
            <div id="reviewContent"></div>
        </main>
    </div>
    <div id="toast" class="toast" role="status"></div>

    <script src="assets/usage-tracker.js"></script>
    <script src="assets/vendor/html2canvas.min.js"></script>
    <script>
        const TOOL_NAMES = {
            test: '图片尺寸核对工具',
            photo: '批量修改图片尺寸工具',
            video: '视频转 GIF 工具'
        };

        const VISIBLE_FIELDS = {
            test: ['verifyRuns', 'mismatchRuns', 'perfectMatchRuns'],
            photo: ['imagesImported', 'configsImported', 'specsCreated', 'configsSaved', 'quickCrop', 'logoEditor', 'logosImported', 'logoSave'],
            video: ['videosImported', 'configsImported', 'quickCrop']
        };

        let currentStore = null;

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function valueOf(bucket, field) {
            return Math.max(0, Number(bucket && bucket[field]) || 0);
        }

        function toolHasAny(tool, data) {
            const b = data && data[tool];
            return !!b && VISIBLE_FIELDS[tool].some((field) => valueOf(b, field) > 0);
        }

        function formatMonthLabel(ym) {
            const m = /^(\d{4})-(\d{2})$/.exec(ym);
            if (!m) return ym;
            return `${m[1]}年${parseInt(m[2], 10)}月`;
        }

        function habitLine(quick, logo) {
            if (quick <= 0 || logo <= 0) return '';
            if (quick === logo) return '快速剪裁与 Logo 编辑器使用次数相同';
            return quick > logo ? '快速剪裁更常用' : 'Logo 编辑器更常用';
        }

        function renderTestNarrative(t, rows) {
            if (valueOf(t, 'verifyRuns') > 0) rows.push(`核对图片 <strong>${valueOf(t, 'verifyRuns')}</strong> 次`);
            if (valueOf(t, 'mismatchRuns') > 0) rows.push(`发现规格不一致 <strong>${valueOf(t, 'mismatchRuns')}</strong> 次`);
            if (valueOf(t, 'perfectMatchRuns') > 0) rows.push(`完美匹配 <strong>${valueOf(t, 'perfectMatchRuns')}</strong> 次`);
        }

        function renderPhotoNarrative(p, rows) {
            if (valueOf(p, 'imagesImported') > 0) rows.push(`导入图片 <strong>${valueOf(p, 'imagesImported')}</strong> 张`);
            if (valueOf(p, 'configsImported') > 0) rows.push(`导入配置 <strong>${valueOf(p, 'configsImported')}</strong> 份`);
            if (valueOf(p, 'specsCreated') > 0) rows.push(`新建规格 <strong>${valueOf(p, 'specsCreated')}</strong> 个`);
            if (valueOf(p, 'configsSaved') > 0) rows.push(`保存修改配置 <strong>${valueOf(p, 'configsSaved')}</strong> 份`);
            const quick = valueOf(p, 'quickCrop');
            const logo = valueOf(p, 'logoEditor');
            if (quick > 0 || logo > 0) {
                const habit = habitLine(quick, logo);
                rows.push(`快速剪裁 <strong>${quick}</strong> 次，Logo 编辑器 <strong>${logo}</strong> 次${habit ? `，${habit}` : ''}`);
            }
            if (valueOf(p, 'logosImported') > 0) rows.push(`导入 Logo <strong>${valueOf(p, 'logosImported')}</strong> 个`);
            if (valueOf(p, 'logoSave') > 0) rows.push(`保存带 Logo 素材 <strong>${valueOf(p, 'logoSave')}</strong> 次`);
        }

        function renderVideoNarrative(v, rows) {
            if (valueOf(v, 'videosImported') > 0) rows.push(`导入视频 <strong>${valueOf(v, 'videosImported')}</strong> 个`);
            if (valueOf(v, 'configsImported') > 0) rows.push(`导入配置 <strong>${valueOf(v, 'configsImported')}</strong> 份`);
            const quick = valueOf(v, 'quickCrop');
            if (quick > 0) rows.push(`快速剪裁 <strong>${quick}</strong> 次`);
        }

        function collectRows(tool, data) {
            const rows = [];
            const bucket = data && data[tool] ? data[tool] : {};
            if (tool === 'test') renderTestNarrative(bucket, rows);
            if (tool === 'photo') renderPhotoNarrative(bucket, rows);
            if (tool === 'video') renderVideoNarrative(bucket, rows);
            return rows;
        }

        function renderToolBlock(tool, data) {
            const rows = collectRows(tool, data);
            if (!rows.length) return '';
            return `
                <section class="tool-block">
                    <h3>${TOOL_NAMES[tool]}</h3>
                    <ul class="narrative">${rows.map((row) => `<li>${row}</li>`).join('')}</ul>
                </section>`;
        }

        function renderMonthMetrics(tool, data) {
            const bucket = data && data[tool] ? data[tool] : {};
            const rows = [];
            if (tool === 'test') {
                if (valueOf(bucket, 'verifyRuns') > 0) rows.push(`核查次数：${valueOf(bucket, 'verifyRuns')}`);
                if (valueOf(bucket, 'mismatchRuns') > 0) rows.push(`规格不一致次数：${valueOf(bucket, 'mismatchRuns')}`);
                if (valueOf(bucket, 'perfectMatchRuns') > 0) rows.push(`完美匹配次数：${valueOf(bucket, 'perfectMatchRuns')}`);
            } else if (tool === 'photo') {
                if (valueOf(bucket, 'imagesImported') > 0) rows.push(`导入图片：${valueOf(bucket, 'imagesImported')} 张`);
                if (valueOf(bucket, 'configsImported') > 0) rows.push(`导入配置：${valueOf(bucket, 'configsImported')} 份`);
                if (valueOf(bucket, 'specsCreated') > 0) rows.push(`新建规格：${valueOf(bucket, 'specsCreated')} 个`);
                if (valueOf(bucket, 'configsSaved') > 0) rows.push(`保存修改配置：${valueOf(bucket, 'configsSaved')} 份`);
                if (valueOf(bucket, 'quickCrop') > 0) rows.push(`快速剪裁：${valueOf(bucket, 'quickCrop')} 次`);
                if (valueOf(bucket, 'logoEditor') > 0) rows.push(`Logo 编辑器：${valueOf(bucket, 'logoEditor')} 次`);
                if (valueOf(bucket, 'logosImported') > 0) rows.push(`导入 Logo：${valueOf(bucket, 'logosImported')} 个`);
                if (valueOf(bucket, 'logoSave') > 0) rows.push(`保存带 Logo 素材：${valueOf(bucket, 'logoSave')} 次`);
            } else {
                if (valueOf(bucket, 'videosImported') > 0) rows.push(`导入视频：${valueOf(bucket, 'videosImported')} 个`);
                if (valueOf(bucket, 'configsImported') > 0) rows.push(`导入配置：${valueOf(bucket, 'configsImported')} 份`);
                if (valueOf(bucket, 'quickCrop') > 0) rows.push(`快速剪裁：${valueOf(bucket, 'quickCrop')} 次`);
            }
            return rows.length ? `<ul class="month-metrics">${rows.map((r) => `<li>${escapeHtml(r)}</li>`).join('')}</ul>` : '';
        }

        function renderStartCodeHtml(store) {
            const code = store && store.startedAt ? store.startedAt : '';
            return code ? `<div class="start-code"><strong>统计起始时间</strong><div>${escapeHtml(code)}</div></div>` : '';
        }

        function renderReviewHtml(store) {
            const totals = store && store.totals ? store.totals : {};
            const totalBlocks = ['test', 'photo', 'video'].map((tool) => renderToolBlock(tool, totals)).filter(Boolean);
            if (!totalBlocks.length) {
                return `<div class="empty-hint">暂无使用记录。去任一工具页操作后，统计会自动保存在本机。</div>${renderStartCodeHtml(store)}`;
            }
            let html = `<h2 class="section-title">总使用情况统计</h2><div class="tool-grid">${totalBlocks.join('')}</div>`;
            const months = Object.keys(store.months || {})
                .filter((key) => ['test', 'photo', 'video'].some((tool) => toolHasAny(tool, store.months[key])))
                .sort((a, b) => b.localeCompare(a));
            months.forEach((ym) => {
                const data = store.months[ym];
                const blocks = ['test', 'photo', 'video'].map((tool) => {
                    const metrics = renderMonthMetrics(tool, data);
                    return metrics ? `<section class="tool-block"><h3>${TOOL_NAMES[tool]}</h3>${metrics}</section>` : '';
                }).filter(Boolean);
                if (blocks.length) html += `<h2 class="month-heading">${formatMonthLabel(ym)}</h2><div class="tool-grid">${blocks.join('')}</div>`;
            });
            return html + renderStartCodeHtml(store);
        }

        function buildPlainTextExport(store) {
            const lines = ['总使用情况统计', '==============================', ''];
            const totals = store && store.totals ? store.totals : {};
            ['test', 'photo', 'video'].forEach((tool) => {
                const rows = collectRows(tool, totals).map((row) => row.replace(/<[^>]+>/g, ''));
                if (!rows.length) return;
                lines.push(`【${TOOL_NAMES[tool]}】`);
                rows.forEach((row) => lines.push(`- ${row}`));
                lines.push('');
            });
            const months = Object.keys(store.months || {})
                .filter((key) => ['test', 'photo', 'video'].some((tool) => toolHasAny(tool, store.months[key])))
                .sort((a, b) => b.localeCompare(a));
            months.forEach((ym) => {
                lines.push(formatMonthLabel(ym));
                lines.push('------------------------------');
                ['test', 'photo', 'video'].forEach((tool) => {
                    const tmp = document.createElement('div');
                    tmp.innerHTML = renderMonthMetrics(tool, store.months[ym]);
                    const text = (tmp.innerText || tmp.textContent || '').trim();
                    if (!text) return;
                    lines.push(`【${TOOL_NAMES[tool]}】`);
                    text.split(/\n+/).map((s) => s.trim()).filter(Boolean).forEach((row) => lines.push(`- ${row}`));
                    lines.push('');
                });
            });
            if (!lines.some((line) => /^【/.test(line))) lines.push('暂无使用记录。');
            if (store && store.startedAt) {
                lines.push('');
                lines.push('【统计起始时间】');
                lines.push(store.startedAt);
            }
            return lines.join('\n').trim();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1600);
        }

        async function exportJpg() {
            const root = document.getElementById('exportRoot');
            if (!root || typeof html2canvas !== 'function') {
                alert('导出组件未加载，请刷新页面重试');
                return;
            }
            const btn = document.getElementById('btnExportImg');
            btn.disabled = true;
            btn.textContent = '生成中...';
            try {
                const canvas = await html2canvas(root, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#0f172a',
                    logging: false,
                    width: root.scrollWidth,
                    height: root.scrollHeight,
                    windowWidth: root.scrollWidth,
                    windowHeight: root.scrollHeight
                });
                canvas.toBlob((blob) => {
                    if (!blob) {
                        alert('导出失败');
                        return;
                    }
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `使用回顾_${new Date().toISOString().slice(0, 10)}.jpg`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
                    showToast('图片已下载');
                }, 'image/jpeg', 0.92);
            } catch (e) {
                console.error(e);
                alert('导出失败，请缩小页面内容后重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '导出图片';
            }
        }

        function exportTxt() {
            const text = buildPlainTextExport(currentStore);
            const blob = new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `使用回顾_${new Date().toISOString().slice(0, 10)}.txt`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
            showToast('TXT 已下载');
        }

        function init() {
            currentStore = UsageTracker.loadStore();
            document.getElementById('reviewContent').innerHTML = renderReviewHtml(currentStore);
            document.getElementById('btnExportImg').onclick = exportJpg;
            document.getElementById('btnExportTxt').onclick = exportTxt;
        }

        init();
    </script>
</body>
</html>
